<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Made by Sumit Nifty Option Chain</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        h2 { text-align: center; color: #333; }
        .controls { display: flex; justify-content: space-between; margin-bottom: 10px; max-width: 900px; margin: 0 auto 10px auto; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 5px; }
        button:hover { background-color: #0056b3; }
        table { width: 100%; max-width: 900px; margin: 0 auto; border-collapse: collapse; background: white; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #343a40; color: white; }
        .call-col { background-color: #e8f5e9; } /* Light green for Calls */
        .put-col { background-color: #ffebee; }  /* Light red for Puts */
        .strike-col { font-weight: bold; background-color: #fff9c4; }
        #status { font-size: 0.9em; color: gray; }
    </style>
</head>
<body>

    <h2>Made by Sumit Nifty Option Chain</h2>
    
    <div class="controls">
        <span id="status">Fetching data...</span>
        <button onclick="downloadCSV()">Download as CSV</button>
    </div>

    <table id="option-chain-table">
        <thead>
            <tr>
                <th colspan="2">CALLS</th>
                <th>STRIKE PRICE</th>
                <th colspan="2">PUTS</th>
            </tr>
            <tr>
                <th>Open Interest (OI)</th>
                <th>Last Price (LTP)</th>
                <th>(NIFTY)</th>
                <th>Last Price (LTP)</th>
                <th>Open Interest (OI)</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <!-- Data will be injected here via JavaScript -->
        </tbody>
    </table>

    <script>
        async function fetchOptionChain() {
            document.getElementById('status').innerText = "Refreshing data...";
            try {
                // Calls the Python backend running on the same server
                const response = await fetch('/api/data');
                const data = await response.json();
                
                if (data.error) {
                    document.getElementById('status').innerText = "Error: " + data.error;
                    return;
                }

                const records = data.records.data;
                const tbody = document.getElementById('table-body');
                tbody.innerHTML = ''; // Clear old data

                // Loop through records and create table rows
                records.forEach(row => {
                    const ce = row.CE || {}; // Call data (if it exists)
                    const pe = row.PE || {}; // Put data (if it exists)

                    const tr = document.createElement('tr');

                    tr.innerHTML = `
                        <td class="call-col">${ce.openInterest !== undefined ? ce.openInterest : '-'}</td>
                        <td class="call-col">${ce.lastPrice !== undefined ? ce.lastPrice : '-'}</td>
                        <td class="strike-col">${row.strikePrice}</td>
                        <td class="put-col">${pe.lastPrice !== undefined ? pe.lastPrice : '-'}</td>
                        <td class="put-col">${pe.openInterest !== undefined ? pe.openInterest : '-'}</td>
                    `;
                    tbody.appendChild(tr);
                });

                const now = new Date();
                document.getElementById('status').innerText = "Last updated: " + now.toLocaleTimeString();
                
            } catch (error) {
                document.getElementById('status').innerText = "Failed to connect to server.";
            }
        }

        // CSV Download Logic
        function downloadCSV() {
            const table = document.getElementById("option-chain-table");
            let csvContent = "";
            for (let row of table.rows) {
                let rowData = [];
                for (let cell of row.cells) {
                    rowData.push('"' + cell.innerText + '"');
                }
                csvContent += rowData.join(",") + "\n";
            }
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", "Nifty_Option_Chain.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Run immediately when page loads
        fetchOptionChain();

        // Auto-refresh exactly every 3 minutes (180,000 milliseconds)
        setInterval(fetchOptionChain, 180000);
    </script>
</body>
</html>
