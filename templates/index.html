<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nifty Live Option Chain (Shoonya API)</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; padding: 20px; margin: 0; }
        h2 { text-align: center; color: #212529; }
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        button { padding: 8px 16px; background-color: #198754; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #157347; }
        .table-container { overflow-x: auto; max-height: 80vh; background: white; border: 1px solid #dee2e6; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; }
        th, td { padding: 8px; border: 1px solid #e9ecef; }
        th { background-color: #212529; color: white; }
        .call-col { background-color: #e8f5e9; }
        .put-col { background-color: #ffebee; }
        .strike-col { font-weight: bold; background-color: #fff9c4; }
    </style>
</head>
<body>

    <h2>Nifty Option Chain (Shoonya Automated API)</h2>
    
    <div class="controls">
        <span id="status">Connecting to server...</span>
        <button onclick="downloadCSV()">Export CSV</button>
    </div>

    <div class="table-container">
        <table id="option-chain-table">
            <thead>
                <tr>
                    <th colspan="3">CALLS (CE)</th>
                    <th>STRIKE</th>
                    <th colspan="3">PUTS (PE)</th>
                </tr>
                <tr>
                    <th>Trading Symbol</th>
                    <th>Token</th>
                    <th>LTP / Price</th>
                    <th>Strike Price</th>
                    <th>LTP / Price</th>
                    <th>Token</th>
                    <th>Trading Symbol</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Data injected dynamically -->
            </tbody>
        </table>
    </div>

    <script>
        async function fetchOptionChain() {
            document.getElementById('status').innerText = "Refreshing Data...";
            try {
                const response = await fetch('/api/data');
                const result = await response.json();
                
                if (result.error) {
                    document.getElementById('status').innerText = "Status: " + result.error;
                    return;
                }

                const tbody = document.getElementById('table-body');
                tbody.innerHTML = '';

                if (result.values) {
                    result.values.forEach(item => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="call-col">${item.tsym || '-'}</td>
                            <td class="call-col">${item.token || '-'}</td>
                            <td class="call-col">${item.lp || '-'}</td>
                            <td class="strike-col">${item.strprc || item.strikeprice || '-'}</td>
                            <td class="put-col">${item.lp || '-'}</td>
                            <td class="put-col">${item.token || '-'}</td>
                            <td class="put-col">${item.tsym || '-'}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }

                const now = new Date();
                document.getElementById('status').innerText = "Live | Last Updated: " + now.toLocaleTimeString();
            } catch (error) {
                document.getElementById('status').innerText = "Server connection failed.";
            }
        }

        function downloadCSV() {
            const table = document.getElementById("option-chain-table");
            let csvContent = "";
            for (let row of table.rows) {
                let rowData = [];
                for (let cell of row.cells) {
                    rowData.push('"' + cell.innerText + '"');
                }
                csvContent += rowData.join(",") + "\n";
            }
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", "Nifty_Option_Chain.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        fetchOptionChain();
        setInterval(fetchOptionChain, 180000); // Refresh every 3 mins
    </script>
</body>
</html>
